extends:
  - C:/Users/Axel/Desktop/dev/agent-workbench/git-hooks/lefthook-base.yml
  # `wb-shellcheck` au pre-commit sur les `.sh` stagés : un constat warning ou error de shellcheck sur une ligne ajoutée
  # ou changée refuse le commit. Le binaire (0.11.0) n'est sur aucun `PATH` : la clé `shellcheck` de `wb-hooks.json`
  # le nomme.
  - C:/Users/Axel/Desktop/dev/agent-workbench/git-hooks/lefthook-shellcheck.yml
lefthook: node "C:/Users/Axel/Desktop/dev/agent-workbench/git-hooks/run-lefthook.mjs"

pre-commit:
  jobs:
    - name: ws-protocol-sync
      glob:
        - "duel-server/src/ws-protocol-{shared,game,prompts,system,replay,solver}.ts"
        - "duel-server/src/game-log/game-log-{types,builder}.ts"
        - "duel-server/src/ocgcore-reason-flags.ts"
        - "front/src/app/pages/pvp/duel-ws-{shared,game,prompts,system,replay,solver}.types.ts"
        - "front/src/app/pages/pvp/game-log/game-log-{types,builder}.ts"
        - "front/src/app/pages/pvp/duel-page/ocgcore-reason-flags.ts"
      run: node scripts/check-ws-protocol-sync.mjs
    - name: animation-parity
      glob: "front/src/app/pages/pvp/duel-page/animation-orchestrator.service.ts"
      run: node scripts/check-animation-parity.mjs
    - name: perspective-zone-key
      # Un motif par dossier, `dossier/*.ext` : sous lefthook, `*` traverse `/` et prend aussi les sous-dossiers
      # (« Measured traps » du `git-hooks/README.md` d'agent-workbench).
      glob: "front/src/app/pages/pvp/*.ts"
      run: node scripts/check-perspective-zone-key.mjs
    - name: front-lint
      root: "front/"
      glob: "front/src/*.{ts,html,scss}"
      run: npx --no-install lint-staged
    # Les réglages des jobs `wb-` du socle, dans son groupe parallèle `ratchets` (décision 273 du carnet-Q
    # d'agent-workbench) : lefthook ne fusionne un job par son nom qu'au même niveau, un réglage resté au premier
    # niveau ne l'atteindrait pas (`wb-config` le refuse). Le groupe passe après les jobs ci-dessus.
    - name: ratchets
      group:
        parallel: true
        jobs:
          - name: wb-identifiers
            glob: "{front/src,front/e2e,duel-server/src,duel-server/scripts,duel-server/test,back/src,scripts}/*.{ts,mts,js,mjs,cjs,java}"
          - name: wb-paths
            glob: "*.md"
          - name: wb-deps
            glob: ["package.json", "*/package.json"]

# Au push, et `npm run verify` (le sous-verbe `verify` du lanceur, qui joue `run pre-push --force`) ;
# `verify:duel`, `verify:front`, `verify:back` n'en gardent que les jobs de leur tag. Les deux builds tournent côte à
# côte, puis les trois suites de tests, elles aussi côte à côte : elles ne partagent ni base ni port, et aucune ne
# remplit la machine (un Chrome, un JVM, un vitest de quelques secondes). Un build en échec saute les tests. `2>&1`
# range stderr dans le bloc de son job. Règles communes : README d'agent-workbench/git-hooks, « A parallel verify ».
pre-push:
  piped: true
  jobs:
    - name: build
      group:
        parallel: true
        jobs:
          - { name: duel-build, tags: [duel], root: duel-server/, run: npm run build 2>&1 }
          - { name: front-build, tags: [front], root: front/, run: npm run build 2>&1 }
    - name: tests
      group:
        parallel: true
        jobs:
          - { name: duel-test, tags: [duel], root: duel-server/, run: npm test 2>&1 }
          - { name: front-test, tags: [front], root: front/, run: npm test -- --watch=false --browsers=ChromeHeadless 2>&1 }
          - { name: back-test, tags: [back], root: back/, run: ./mvnw -q test 2>&1 }
