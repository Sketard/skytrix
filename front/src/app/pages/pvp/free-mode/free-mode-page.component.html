<div class="free-mode-page">
  <!-- Board reused from PvP. v1a display: chainPhase hard 'idle' (POLL-DROP
       watchdog), empty overlay inputs, no prompt. Interaction (étape 4) routes
       the board outputs through FreeModeInteractionService: cardInspectRequest =
       tap/arm (or inspect on forceExpanded long-press), emptyZoneTap = pose,
       zonePillRequest = deposit. Mini-bars + inspector display land in étape 5. -->
  <app-pvp-board-container
    [duelState]="renderedState()"
    [readOnly]="false"
    [preview]="false"
    [ownPlayerIndex]="0"
    [chainPhase]="'idle'"
    [activeChainLinks]="emptyChainLinks"
    [highlightedZones]="emptySet"
    [actionablePrompt]="null"
    (cardInspectRequest)="interaction.onCardTap($event)"
    (emptyZoneTap)="interaction.onEmptyZoneTap($event)"
    (zonePillRequest)="interaction.onPileTap($event.zoneId)" />

  <!-- Player hand (bottom). Tap a card → arm by positional index (resolves the
       duplicate-cardCode ambiguity); long-press / right-click → inspect. -->
  <app-pvp-hand-row
    class="free-mode-hand"
    side="player"
    [cards]="playerHand()"
    [actionableCardIndices]="handActionableIndices()"
    (handCardAction)="onHandCardAction($event)"
    (cardInspectRequest)="onHandInspect($event)" />

  <!-- PvP card inspector (T3) — opened by double-tap / long-press. -->
  @if (inspectedCard(); as card) {
    <app-pvp-card-inspector-wrapper
      [card]="card"
      [initialForceExpanded]="inspectorForceExpanded()"
      (dismissed)="closeInspector()" />
  }
</div>
