<div class="free-mode-page">
  <!-- Board reused from PvP. v1a display: chainPhase hard 'idle' (POLL-DROP
       watchdog), empty overlay inputs, no prompt. Interaction (tap=arm, pose,
       swap, mini-bars) is wired in étape 4 via FreeModeInteractionService —
       the outputs are intentionally unbound here (display-only). -->
  <app-pvp-board-container
    [duelState]="renderedState()"
    [readOnly]="false"
    [preview]="false"
    [ownPlayerIndex]="0"
    [chainPhase]="'idle'"
    [activeChainLinks]="emptyChainLinks"
    [highlightedZones]="emptySet"
    [actionablePrompt]="null" />
</div>
