@if (visible()) {
  <div class="zone-browser"
       [class.zone-browser--expanded]="expanded()"
       [class.zone-browser--closing]="isClosing()"
       role="dialog"
       [attr.aria-label]="zoneId() + ' browser'"
       (keydown)="onKeydown($event)"
       (contextmenu)="close(); $event.preventDefault()">

    <button class="zone-browser__expand-tab"
            type="button"
            (click)="toggleExpanded($event)"
            [attr.aria-label]="(expanded() ? 'duel.zoneBrowser.collapse' : 'duel.zoneBrowser.expand') | translate">
      {{ expanded() ? '⊟' : '⊞' }}
    </button>

    <div class="zone-browser__header">
      @if (zoneIconPath) {
        <img [src]="zoneIconPath" alt="" class="zone-browser__zone-icon" />
      }
      <span class="zone-browser__title">{{ zoneLabel }} ({{ cards().length }})</span>
    </div>

    <div class="zone-browser__grid scrollbar-visible">
      @for (card of cards(); track $index) {
        <button class="zone-browser__card"
                type="button"
                (click)="onCardClick(card)">
          @if (card.cardCode) {
            <img [src]="getCardImageUrlByCode(card.cardCode)"
                 [alt]="card.name ?? 'Card'"
                 class="zone-browser__card-art"
                 (error)="$any($event.target).src='assets/images/card_back.jpg'">
          } @else {
            <!-- Face-down card (e.g. opponent Extra Deck non-Pendulum) —
                 identity hidden, shown as a card back. -->
            <img src="assets/images/card_back.jpg" alt="Face-down card"
                 class="zone-browser__card-art">
          }
        </button>
      }
      @if (cards().length === 0) {
        <div class="zone-browser__empty">{{ 'duel.zoneBrowser.empty' | translate }}</div>
      }
    </div>

  </div>
}
