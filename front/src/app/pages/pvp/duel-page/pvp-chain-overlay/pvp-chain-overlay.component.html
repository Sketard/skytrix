@if (activeChainLinks().length > 0) {
  <div
    class="chain-overlay-container"
    [class.visible]="overlayVisible()"
    [style.--chain-resolve-pulse]="cssDurations().pulse"
    [style.--chain-resolve-exit]="cssDurations().exit"
    [style.--chain-resolve-exit-visual]="cssDurations().exitVisual"
    [style.--chain-entry-duration]="cssDurations().entry"
    [style.--chain-overflow-duration]="cssDurations().overflow"
    [style.--chain-shove-duration]="cssDurations().shove"
    [style.--chain-cascade-delay]="cssDurations().cascadeDelay"
    [style.--chain-overlay-fadein-ms]="cssDurations().overlayFadeIn"
    role="status"
    aria-live="polite">
    <div class="chain-overlay-backdrop"></div>
    <div class="chain-card-container" [class.chain-card-container--exiting]="!!exitingCard()">
      <!-- Exiting card (overflow or resolve-exit) -->
      @if (exitingCard(); as exiting) {
        <div
          class="chain-card"
          [class.chain-card--left]="exiting.card.side === 'left'"
          [class.chain-card--right]="exiting.card.side === 'right'"
          [class.chain-card--level-0]="exiting.card.level === 0"
          [class.chain-card--level-1]="exiting.card.level === 1"
          [class.chain-card--level-2]="exiting.card.level === 2"
          [class.chain-card--level-3]="exiting.card.level === 3"
          [class.chain-card--level-4]="exiting.card.level === 4"
          [class.chain-card--exiting]="exiting.type === 'overflow'"
          [class.chain-card--resolve-exiting]="exiting.type === 'resolved' && !exiting.negated"
          [class.chain-card--negated-exiting]="exiting.type === 'resolved' && exiting.negated">
          <img
            class="chain-card__art"
            [src]="getCardImageUrl(exiting.card.cardCode)"
            [alt]="exiting.card.cardName"
            (error)="$any($event.target).src = 'assets/images/card_back.jpg'" />
          <span class="chain-badge">{{ exiting.card.chainIndex + 1 }}</span>
        </div>
      }

      <!-- Visible cards (max 5 — 3 per majority side, 2 per minority side).
           Dense-chain fix (2026-06-12) : chainIndex seul n'est plus unique
           (les liens d'une chaîne suivante peuvent coexister avec le même
           index, génération différente) → clé composite chainIndex:generation. -->
      @for (card of visibleCards(); track cardKey(card); let i = $index) {
        <div
          class="chain-card"
          [class.chain-card--entering]="cardKey(card) === enteringCardKey()"
          [class.chain-card--shoved]="cardKey(card) === shovedCardKey()"
          [class.chain-card--resolving]="
            card.slot === 'front' &&
            phase() === 'resolving' &&
            exitingCardKey() !== cardKey(card) &&
            resolvingKey() === cardKey(card)
          "
          [class.chain-card--negated]="
            card.slot === 'front' &&
            phase() === 'resolving' &&
            exitingCardKey() !== cardKey(card) &&
            negatedResolvingKey() === cardKey(card) &&
            cardKey(card) !== enteringCardKey()
          "
          [class.chain-card--left]="card.side === 'left'"
          [class.chain-card--right]="card.side === 'right'"
          [class.chain-card--level-0]="card.level === 0"
          [class.chain-card--level-1]="card.level === 1"
          [class.chain-card--level-2]="card.level === 2"
          [class.chain-card--level-3]="card.level === 3"
          [class.chain-card--level-4]="card.level === 4"
          [class.chain-card--front]="card.slot === 'front'"
          [class.chain-card--mid]="card.slot === 'mid'"
          [class.chain-card--back]="card.slot === 'back'">
          <img
            class="chain-card__art"
            [src]="getCardImageUrl(card.cardCode)"
            [alt]="card.cardName"
            (error)="$any($event.target).src = 'assets/images/card_back.jpg'" />
          <span class="chain-badge">{{ card.chainIndex + 1 }}</span>
        </div>
      }
    </div>
  </div>
}
