<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Skytrix</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Web fonts are self-hosted under /assets/fonts/ — @font-face declarations
         live in src/app/styles/_fonts.scss (text: Inter / Rajdhani / JetBrains
         Mono) and src/app/styles/material.scss (Roboto). No network dependency
         at build time or runtime. See _fonts.scss header for rationale.
         Preload the critical above-the-fold fonts so they fetch in parallel
         with the bundle instead of waiting for the CSS to parse. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/roboto-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/inter-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/assets/fonts/material-icons.woff2" />
  </head>
  <body class="mat-typography">
    <app-root></app-root>
  </body>
</html>
