# =============================================================================
# Profil "perf" — instrumentation de validation chiffrée (Phase 1 du chantier
# perf-audit-instrumentation-chantier.md).
#
# Activation : -Dspring.profiles.active=perf  (ou SPRING_PROFILES_ACTIVE=perf).
# NE PAS activer en production permanente — le logging SQL est verbeux.
#
# Ce profil rend visible le COUNT de requêtes SQL par appel d'endpoint —
# c'est la mesure qui valide les findings N+1 (B-C1/B-M6/B-M7) et la cible
# #9 du budget perf : "nombre de requêtes invariant quel que soit N".
# =============================================================================

# Hibernate logue chaque session avec son résumé de stats (nb requêtes,
# temps max, collections fetchées) — lire la ligne "Session Metrics" après
# un appel d'endpoint donne directement le count N+1.
logging.level.org.hibernate.stat=DEBUG

# SQL brut + binding des paramètres — pour EXPLAIN ANALYZE et l'inspection
# des requêtes générées (valide B-C3 LIKE sans index, B-C4 passcode).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Transactions — surface les requêtes déclenchées en couche MVC à cause de
# open-in-view (valide B-M1).
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
