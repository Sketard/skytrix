spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skytrix}
spring.jpa.properties.hibernate.default_schema="public"
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.flyway.validateOnMigrate=false
spring.flyway.baselineOnMigrate=true
server.servlet.context-path=/api
# Actuator — on separate port (not exposed via /api).
# health = liveness probe (public). metrics = perf instrumentation (Phase 0a
# of the perf-audit chantier — perf-audit-instrumentation-chantier.md).
# The 8081 port is internal-only; do not expose it publicly.
management.server.port=8081
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# Per-endpoint HTTP timers (http.server.requests) with latency percentiles.
# Native Micrometer — no @Timed annotation, no application code.
# `percentiles` (client-side) surfaces p50/p95/p99 directly in the JSON of
# /actuator/metrics/http.server.requests when filtered by a uri tag — this
# is what we read in Phase 0.5. We deliberately do NOT set
# `percentiles-histogram` (that only feeds a Prometheus backend, and the
# project allows no new deps — no micrometer-registry-prometheus).
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,400ms,800ms
# Hibernate statistics — N+1 / query-count instrumentation (validates findings
# B-C1/B-M6/B-M7). Surfaced as hibernate.* meters once stats are on.
spring.jpa.properties.hibernate.generate_statistics=true
# Hikari pool metrics (hikaricp.* meters) — connection-pool saturation.
spring.datasource.hikari.register-mbeans=true
document.folder.image.small=./images/small/
document.folder.image.big=./images/big/
# JWT config
jwt.secret=${JWT_SECRET:NyfG9bT0gZtOnVlnuZ5UQwyEuN5HEZcm23WxEIZskjPSqxIvNG275FLvo46Ovmbq}
jwt.validity-period=60000000
jwt.refresh-validity-period=86400000
# Duel server (HTTP, server-to-server)
duel-server.url=${DUEL_SERVER_URL:http://localhost:3001}
duel-server.internal-key=${DUEL_SERVER_INTERNAL_KEY:dev-internal-key}
# Replay retention
replay.retention-days=${REPLAY_RETENTION_DAYS:30}
# Graceful shutdown for clean redeploys
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
